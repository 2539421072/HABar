<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HA 面板</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg style="display:none" aria-hidden="true">
  <symbol id="i-light" viewBox="0 0 24 24"><circle cx="12" cy="8.6" r="5.6" fill="currentColor" stroke="none"/><rect x="9.6" y="14.9" width="4.8" height="2.2" rx="1" fill="currentColor" stroke="none"/><rect x="10.6" y="18.1" width="2.8" height="1.8" rx=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-switch" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M7.6 6.4a7 7 0 1 0 8.8 0"/></symbol>
  <symbol id="i-cover" viewBox="0 0 24 24"><path d="M4 4h16M4 8h16M8 12h8M8 16h8M8 20h8"/><path d="M12 4v4"/></symbol>
  <symbol id="i-climate" viewBox="0 0 24 24"><path d="M14 14.6V5.4a2 2 0 1 0-4 0v9.2a3.7 3.7 0 1 0 4 0z"/><path d="M12 9v6.5"/></symbol>
  <symbol id="i-fan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M12 10c0-3 1-6 3-6s2.6 3.4.6 5.6"/><path d="M14 12c3 0 6 1 6 3s-3.4 2.6-5.6.6"/><path d="M10 12c-3 0-6-1-6-3s3.4-2.6 5.6-.6"/><path d="M12 14c0 3-1 6-3 6s-2.6-3.4-.6-5.6"/></symbol>
  <symbol id="i-media" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8"/></symbol>
  <symbol id="i-scene" viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-vacuum" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><circle cx="12" cy="13" r="2.5"/><path d="M12 5V2.5"/></symbol>
  <symbol id="i-sensor" viewBox="0 0 24 24"><path d="M4 15a8 8 0 0 1 16 0"/><path d="M12 15l3.5-3.5"/><circle cx="12" cy="15" r="1.4"/></symbol>
  <symbol id="i-automation" viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.6 6.4"/><path d="M20 5v6h-6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0V21a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15H2.8a2 2 0 1 1 0-4H3a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9.6 3V2.8a2 2 0 1 1 4 0V3a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.6 1.6 0 0 0 21 9.6h.2a2 2 0 1 1 0 4H21a1.6 1.6 0 0 0-1.6 1.4z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M8 10l4 4 4-4"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5l-9 7 9 7z"/><path d="M6 5v14"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M7.6 6.4a7 7 0 1 0 8.8 0"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12z"/></symbol>
</svg>

<div class="app">
  <header class="hdr">
    <div class="brand">
      <span class="dot" id="dot"></span>
      <div class="brand-txt">
        <div class="ttl">Home Assistant</div>
        <div class="sub" id="statusText">连接中…</div>
      </div>
    </div>
    <div class="hdr-actions">
      <button class="icon-btn" data-act="refresh" title="刷新"><svg class="ic"><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" data-act="tab" data-tab="settings" title="设置"><svg class="ic"><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab on" data-act="tab" data-tab="devices">设备</button>
    <button class="tab" data-act="tab" data-tab="manage">管理</button>
  </nav>

  <main class="view" id="view"></main>

  <footer class="ftr">
    <span id="ftrLeft">—</span>
    <span class="ftr-right" id="ftrRight">HA 面板</span>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
